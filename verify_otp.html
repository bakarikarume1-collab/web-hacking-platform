<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Step 2</title>
    <style>
        /* =========================
        GLOBAL RESET
        ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
            overflow: hidden;
        }

        /* optional background glow */
        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,255,255,0.15), transparent 60%);
            z-index: -1;
        }

        /* =========================
        OTP CONTAINER
        ========================= */
        .container {
            width: 380px;
            padding: 30px;
            border-radius: 15px;
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(0,255,255,0.3);
            box-shadow: 0 0 25px rgba(0,255,255,0.2);
            backdrop-filter: blur(10px);
            text-align: center;
            color: white;
        }

        /* TITLE */
        h2 {
            color: cyan;
            margin-bottom: 10px;
            text-shadow: 0 0 10px cyan;
        }

        /* TEXT */
        p {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .email-highlight {
            color: #00ffcc;
            font-weight: bold;
        }

        /* =========================
        FORM
        ========================= */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 13px;
        }

        /* OTP INPUT */
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 20px;
            text-align: center;
            letter-spacing: 10px;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border: 1px solid cyan;
            box-shadow: 0 0 10px cyan;
        }

        /* =========================
        BUTTON
        ========================= */
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, cyan, #00ff99);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: black;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px cyan;
        }

        /* =========================
        FOOTER LINK
        ========================= */
        .footer-links {
            margin-top: 15px;
        }

        .footer-links a {
            color: cyan;
            text-decoration: none;
            font-size: 13px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Verify OTP code</h2>
    <p>We have sent (OTP) to your email: <br><span class="email-highlight">{{ email }}</span></p>
    
    <form action="/verify-otp" method="POST">
        <div class="form-group">
            <label for="otp">Enter OTP Code (6 digits):</label>
            <input type="text" id="otp" name="otp" required placeholder="000000" maxlength="6" autocomplete="off">
        </div>
        <button type="submit">Verify OTP</button>
    </form>

    <div class="footer-links">
        <a href="/forgot-password">Resend OTP Code</a>
    </div>
</div>
<script>
    // auto focus + restrict to numbers
        const otpInput = document.getElementById("otp");

        otpInput.addEventListener("input", function () {
            this.value = this.value.replace(/[^0-9]/g, "");
        });
</script>

</body>
</html>

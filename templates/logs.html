<!DOCTYPE html>
<html>
<head>
    <title>Login Attempts Logs</title>
    <style>
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Login Activity Logs</h1>
    <table>
        <tr>
            <th>Email</th>
            <th>Failed Attempts</th>
            <th>IP Address</th>
            <th>Last Attempt Time</th>
        </tr>
        {% for log in logs %}
        <tr>
            <td>{{ log[0] }}</td>
            <td>{{ log[1] }}</td>
            <td>{{ log[2] }}</td>
            <td>{{ log[3] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>

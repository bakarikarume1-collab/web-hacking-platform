<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <style>
        /* =========================
   GLOBAL RESET
========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
        }

        /* background glow */
        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,255,255,0.12), transparent 60%);
            z-index: -1;
        }

        /* =========================
        CONTAINER
        ========================= */
        .container {
            width: 380px;
            padding: 30px;
            border-radius: 15px;
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(0,255,255,0.3);
            box-shadow: 0 0 25px rgba(0,255,255,0.2);
            backdrop-filter: blur(10px);
            color: white;
            text-align: center;
        }

        /* TITLE */
        h2 {
            color: cyan;
            margin-bottom: 10px;
            text-shadow: 0 0 10px cyan;
        }

        /* SUCCESS TEXT */
        p {
            color: #00ff99;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* FORM */
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 13px;
        }

        /* INPUT */
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input[type="password"]:focus {
            border: 1px solid cyan;
            box-shadow: 0 0 10px cyan;
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, cyan, #00ff99);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: black;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px cyan;
        }
    </style>
        /* =========================
</head>
<body>

<div class="container">
    
    <p>✓ Verification passed successfully</p>
    <h2>Enter new password</h2>
    
    <form action="/change-password" method="POST">
        <div class="form-group">
            <label for="new_password">New Password:</label>
            <input type="password" id="new_password" name="new_password" required placeholder="new password">
        </div>
        
        <div class="form-group">
            <label for="confirm_password">Confirm new Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="Enter password to confirm">
        </div>
        
        <button type="submit">Change Password</button>
    </form>
</div>

</body>
</html>

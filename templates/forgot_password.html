<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        /* =========================
   GLOBAL RESET
========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
            overflow: hidden;
        }

        /* glow background */
        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,255,255,0.12), transparent 60%);
            z-index: -1;
        }

        /* =========================
        CONTAINER
        ========================= */
        .container {
            width: 380px;
            padding: 30px;
            border-radius: 15px;
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(0,255,255,0.3);
            box-shadow: 0 0 25px rgba(0,255,255,0.2);
            backdrop-filter: blur(10px);
            color: white;
        }

        /* TITLE */
        h2 {
            text-align: center;
            color: cyan;
            margin-bottom: 10px;
            text-shadow: 0 0 10px cyan;
        }

        /* TEXT */
        p {
            text-align: center;
            color: #bbb;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* FORM */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 13px;
        }

        /* INPUT */
        input[type="email"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input[type="email"]:focus {
            border: 1px solid cyan;
            box-shadow: 0 0 10px cyan;
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, cyan, #00ff99);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: black;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px cyan;
        }

        /* FOOTER */
        .footer-links {
            margin-top: 15px;
            text-align: center;
        }

        .footer-links a {
            color: cyan;
            text-decoration: none;
            font-size: 13px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Forgot Password</h2>
    <p>Enter the email address associated with your account:</p>

    <form action="/forgot-password" method="POST">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="example@gmail.com">
        </div>
        <button type="submit">Send OTP Code</button>
    </form>

    <div class="footer-links">
        <a href="/login">Back to Login</a>
    </div>
</div>

</body>
</html>
